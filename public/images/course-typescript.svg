<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7b00ff"/>
      <stop offset="0.5" stop-color="#00c2ff"/>
      <stop offset="1" stop-color="#39ff14"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="400" fill="url(#sky)"/>
  <polygon points="60,60 140,40 120,120" fill="#fff200" opacity="0.9"/>
  <polygon points="690,300 760,330 700,370" fill="#ff00c8" opacity="0.9"/>
  <circle cx="700" cy="80" r="34" fill="none" stroke="#ff2a6d" stroke-width="10"/>
  <path d="M40 330 l30 -30 l30 30 l30 -30 l30 30 l30 -30" fill="none" stroke="#fff200" stroke-width="8" stroke-linejoin="round"/>
  <g fill="#ffffff" opacity="0.6">
    <circle cx="560" cy="60" r="5"/>
    <circle cx="250" cy="340" r="5"/>
    <circle cx="620" cy="250" r="5"/>
    <circle cx="190" cy="90" r="5"/>
  </g>
  <text x="400" y="180" text-anchor="middle" fill="#ffffff" stroke="#ff00c8" stroke-width="2" filter="url(#glow)" font-family="system-ui, sans-serif" font-size="48" font-weight="bold">TypeScript</text>
  <text x="400" y="240" text-anchor="middle" fill="#fff200" stroke="#3a0066" stroke-width="4" paint-order="stroke" font-family="system-ui, sans-serif" font-size="24">Introduction Course</text>
</svg>
