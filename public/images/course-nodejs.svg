<svg xmlns="http://www.w3.org/2000/svg" width="800" height="400" viewBox="0 0 800 400">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a0033"/>
      <stop offset="0.55" stop-color="#ff2a6d"/>
      <stop offset="1" stop-color="#ff9a00"/>
    </linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff200"/>
      <stop offset="1" stop-color="#ff00c8"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="800" height="400" fill="url(#sky)"/>
  <circle cx="400" cy="330" r="110" fill="url(#sun)" opacity="0.85"/>
  <g stroke="#00f0ff" stroke-width="2" opacity="0.7">
    <line x1="0" y1="320" x2="800" y2="320"/>
    <line x1="0" y1="345" x2="800" y2="345"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="400" y1="320" x2="400" y2="400"/>
    <line x1="400" y1="320" x2="160" y2="400"/>
    <line x1="400" y1="320" x2="640" y2="400"/>
    <line x1="400" y1="320" x2="-80" y2="400"/>
    <line x1="400" y1="320" x2="880" y2="400"/>
  </g>
  <text x="400" y="180" text-anchor="middle" fill="#ffffff" stroke="#ff00c8" stroke-width="2" filter="url(#glow)" font-family="system-ui, sans-serif" font-size="48" font-weight="bold">Node.js</text>
  <text x="400" y="240" text-anchor="middle" fill="#00f0ff" stroke="#1a0033" stroke-width="4" paint-order="stroke" font-family="system-ui, sans-serif" font-size="24">REST APIs Course</text>
</svg>
